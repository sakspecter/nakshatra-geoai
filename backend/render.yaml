# Render blue/blueprint: Project Nakshatra FastAPI backend.
# Free tier = one instance each for web service + optional Postgres/disks.
# NOTE: we do NOT use Render Postgres here because Supabase is the DB host.
# This targets the Python App/Docker runtime using the repo Dockerfile.

services:
  - type: web
    name: nakshatra-backend
    runtime: docker
    repo: https://github.com/<YOU>/<REPO>   # set your repo
    plan: free
    region: singapore                   # near your Next.js/Vercel users (or ohio/singapore)
    branch: main
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PROJECT_NAME
        value: Project Nakshatra
      - key: VERSION
        value: 0.1.0
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      # --- CORS ---
      - key: DB_POOL_SIZE
        value: 2          # keep free-tier asyncpg lean
      - key: DB_MAX_OVERFLOW
        value: 5
      - key: POSTGRES_DRIVER
        value: postgresql+asyncpg
      # Secret stubs — replace real ones in Render dashboard "Environment":
      - key: POSTGRES_ASYNC_URL
        sync: false        # => prompts you to paste the Supabase async DSN in UI
